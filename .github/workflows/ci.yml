name: Platform checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node --check app/static/semantics.js
      - run: node --check tests/semantics-browser.cjs
      - run: node --check tests/calculations-browser.cjs
      - run: node --check tests/measure-functions-browser.cjs
      - run: node --check app/static/flows.js
      - run: node --check app/static/docs.js
      - run: node --check tests/browser-smoke.cjs
      - run: python -m compileall -q app scripts deploy
      - run: node --check tests/workflows-browser.cjs
      - run: node --check tests/analysis-browser.cjs
      - run: node --check tests/python-notebook-browser.cjs
      - run: node --check tests/cdc-browser.cjs
      - run: node --check tests/flows-browser.cjs
      - run: node --check tests/hourly-backfills-browser.cjs
  postgres-cdc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/dev_stack.py init
      - run: docker compose --env-file deploy/runtime/stack.env -f deploy/compose.yml up -d --wait postgres
      - run: DATA_PLATFORM_TEST_CDC=1 python -m pytest -q tests/test_cdc.py
  python-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/dev_stack.py notebooks
      - run: DATA_PLATFORM_TEST_PYTHON_IMAGE="$(docker image inspect data-platform-python:dev --format '{{.Id}}')" python -m pytest -q tests/test_python_notebooks.py
